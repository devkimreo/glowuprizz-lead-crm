<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,sans-serif;padding:2rem;color:#17231d}h1{letter-spacing:-.04em}p{color:#66736b}label{display:grid;gap:.4rem;margin:1rem 0;font-weight:700}input,select{font:inherit;padding:.8rem;border:1px solid #cad5cd;border-radius:8px}button{width:100%;border:0;border-radius:8px;padding:.9rem;background:#16724a;color:white;font:inherit;font-weight:800}</style></head><body><h1>무료 성장 진단 신청</h1><p>연락처를 남기면 맞춤 체크리스트를 보내드립니다.</p><form><label>이름<input name="name" required></label><label>이메일<input name="email" type="email" required></label><label>관심 분야<select name="interest"><option>브랜딩</option><option>마케팅</option><option>콘텐츠</option></select></label><button type="submit">무료로 신청하기</button></form></body></html>
